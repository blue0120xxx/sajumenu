# sajumenu.com 이 살아있는지 매일 한 번 확인하는 자동 점검이에요.
# GitHub 서버에서 돌기 때문에 실제 사이트에 접속할 수 있어요 (클라우드 점검봇은 못 함).
# 사이트가 죽어 있으면 이 작업이 "실패"로 뜨고, GitHub가 강민성님 이메일로 알려줘요.
name: 사이트 살아있나 확인

on:
  schedule:
    # 매일 00:00 UTC = 한국시간 오전 9시에 한 번 실행
    - cron: "0 0 * * *"
  # 저장소 Actions 탭에서 "Run workflow" 버튼으로 직접 돌릴 수도 있어요
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 홈페이지 확인 (HTTP 200 + 제목 문구)
        run: |
          # -sS 조용히, -L 리다이렉트 따라가기, --max-time 20 20초 안에 응답 없으면 실패
          body=$(curl -sSL --max-time 20 -w "\nHTTP_CODE:%{http_code}" https://sajumenu.com/)
          code=$(echo "$body" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          echo "응답 코드: $code"
          if [ "$code" != "200" ]; then
            echo "::error::sajumenu.com 이 200이 아니에요 (코드 $code). 사이트가 죽었을 수 있어요."
            exit 1
          fi
          # 페이지 안에 이 문구가 있어야 정상 (빈 페이지나 에러 페이지가 아님)
          if ! echo "$body" | grep -q "오늘의 사주 메뉴"; then
            echo "::error::200은 왔는데 페이지 내용이 이상해요 ('오늘의 사주 메뉴' 문구가 없음)."
            exit 1
          fi
          echo "홈페이지 정상"

      - name: 부가 파일 확인 (sitemap / og 이미지 / robots)
        run: |
          fail=0
          for url in \
            "https://sajumenu.com/sitemap.xml" \
            "https://sajumenu.com/og-image.png" \
            "https://sajumenu.com/robots.txt"; do
            code=$(curl -sSL --max-time 20 -o /dev/null -w "%{http_code}" "$url")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url 이 200이 아니에요 (코드 $code)."
              fail=1
            fi
          done
          exit $fail
